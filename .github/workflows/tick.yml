name: tick

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trader-data
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Jedno kolo obchodníka
        run: python3 paper_trader.py --once

      - name: Uložit data zpět do repozitáře
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      - name: Poslat chybu na Telegram
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Paper trader: hodinové kolo selhalo. Detail: ${RUN_URL}" > /dev/null
