name: denni-report

on:
  schedule:
    - cron: "43 18 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Poslat denní report na Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 paper_trader.py --telegram
