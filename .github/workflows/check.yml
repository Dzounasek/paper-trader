name: check-data

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Zkontrolovat zdroje dat
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 paper_trader.py --check
